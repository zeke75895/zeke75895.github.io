<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeping Letter</title>
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #eee;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        /* twinkling stars animation */
        @keyframes twinkle {
            0%, 100% {opacity: 0.8;}
            50% {opacity: 0.2;}
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="10" cy="20" r="1" fill="white"/><circle cx="50" cy="80" r="1" fill="white"/><circle cx="90" cy="40" r="1" fill="white"/></svg>') repeat;
            opacity: 0.6;
            animation: twinkle 2s infinite ease-in-out;
            pointer-events: none;
        }
        .letter {
            max-width: 600px;
            margin: 0 auto;
            border: 2px dashed #888;
            padding: 20px;
            background-color: rgba(20,20,40,0.85);
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            animation: fadeIn 1.5s ease-in-out;
        }
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            .letter {
                padding: 15px;
                border-width: 1px;
            }
            body::before {
                /* reduce star density on small screens */
                opacity: 0.4;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            .letter {
                font-size: 0.9rem;
            }
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);} 
            to {opacity: 1; transform: translateY(0);} 
        }
        .letter p {
            margin: 0 0 1.2em;
            line-height: 1.4;
        }
        .from, .to {
            font-weight: bold;
        }
        .signature {
            text-align: right;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="letter">
        <p class="from">From: Kelechi</p>
        <p>I'm sleeping right now and have been since 9 because daylight saving is tomorrow and I'm tired.</p>
        <p class="to">To: W</p>
    </div>
</body>
</html>
