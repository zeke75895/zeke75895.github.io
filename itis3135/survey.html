<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIS 3135 — Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Outback Customer Survey</h2>
    
        <p>Welcome to the Outback Emporium! We value your feedback about your bushwalking experience at our store. Please take a moment to complete this survey.</p>
        
        <form id="survey-form">

        <label id="name-label" for="name">Your Bush Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your bush name" required>
        
        <label id="email-label" for="email">Your Billabong Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your billabong email" required>
        
        <label id="number-label" for="number">How many winters have you seen? (optional):</label>
        <input type="number" id="number" name="number" min="13" max="120" placeholder="Enter your age">

        <label for="dropdown">How did you hear about our billabong?</label>
        <select id="dropdown" name="source">
            <option value="" disabled selected>Select an option</option>
            <option value="roo-mendation">Roo-mendation</option>
            <option value="bush-telegraph">Bush Telegraph</option>
            <option value="social-didgeridoo">Social Didgeridoo</option>
            <option value="outback-signs">Outback Signs</option>
            <option value="other">Other</option>
        </select>
        
        <fieldset>
            <legend>How many boomerangs would you give your roo experience?</legend>
            <input type="radio" id="very-satisfied" name="satisfaction" value="very-satisfied">
            <label for="very-satisfied">🦘🦘🦘🦘🦘 Five Boomerangs (Bundaberg Excellent!)</label><br>
            
            <input type="radio" id="satisfied" name="satisfaction" value="satisfied">
            <label for="satisfied">🦘🦘🦘🦘 Four Boomerangs (Great Outback!)</label><br>
            
            <input type="radio" id="neutral" name="satisfaction" value="neutral">
            <label for="neutral">🦘🦘🦘 Three Boomerangs (Fair Dinkum)</label><br>
            
            <input type="radio" id="dissatisfied" name="satisfaction" value="dissatisfied">
            <label for="dissatisfied">🦘🦘 Two Boomerangs (Needs Work)</label><br>
            
            <input type="radio" id="very-dissatisfied" name="satisfaction" value="very-dissatisfied">
            <label for="very-dissatisfied">🦘 One Boomerang (G'day Mate, Not Great)</label>
        </fieldset>
        
        <fieldset>
            <legend>What did you spot during your visit? (Select all that apply)</legend>
            <input type="checkbox" id="improve-quality" name="improvements" value="quality">
            <label for="improve-quality">Kangaroo Sighting</label><br>
            
            <input type="checkbox" id="improve-support" name="improvements" value="support">
            <label for="improve-support">Boomerang Demo</label><br>
            
            <input type="checkbox" id="improve-pricing" name="improvements" value="pricing">
            <label for="improve-pricing">Vegemite Tasting</label><br>
            
            <input type="checkbox" id="improve-website" name="improvements" value="website">
            <label for="improve-website">Koala Encounter</label><br>
            
            <input type="checkbox" id="improve-delivery" name="improvements" value="delivery">
            <label for="improve-delivery">Platypus Spotting</label>
        </fieldset>
        
        <label for="comments">Any other bush wisdom to share?</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Share your outback secrets..."></textarea>
        
        <input type="submit" id="submit" value="Share Your Wisdom">
        </form>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
