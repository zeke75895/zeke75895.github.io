<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction Form | Kangaroo Tech Lab</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="../scripts/HTMLInclude.min.js" defer></script>
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <div data-include="components/header.html"></div>

    <main>
        <section class="page-intro">
            <h1>Introduction Form</h1>
            <p>Fill out the form below to describe yourself and your project idea. The submitted summary appears immediately.</p>
        </section>

        <section class="contact-layout">
            <form id="introForm" class="contact-form" novalidate>
                <label for="visitorName">Name</label>
                <input type="text" id="visitorName" name="visitorName" placeholder="Your name" required>

                <label for="visitorEmail">Email</label>
                <input type="email" id="visitorEmail" name="visitorEmail" placeholder="you@example.com" required>

                <label for="courseSection">Course section</label>
                <input type="text" id="courseSection" name="courseSection" placeholder="e.g. ITIS 3135" required>

                <label for="projectIdea">Project idea</label>
                <textarea id="projectIdea" name="projectIdea" rows="5" maxlength="200" placeholder="Describe your website project"></textarea>
                <p id="ideaCharCount" class="muted-text">0 / 200 characters</p>

                <button class="button primary" type="submit">Submit introduction</button>
            </form>

            <div class="service-card" id="introResult">
                <h2>Submission summary</h2>
                <p>Complete the form to see the generated introduction summary here.</p>
            </div>
        </section>
    </main>

    <div data-include="components/footer.html"></div>
</body>
</html>
